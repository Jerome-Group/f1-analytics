# The self-hosted OpenF1 stack: somebody else's software, run here and owned by nobody in this
# repository. The three upstream services are one image built from the pinned checkout in
# upstream.env; MongoDB and Mosquitto are stock (ADR-0003).
#
# Reached only through bin/ — a bare `docker compose` here writes to the internal disk (ADR-0004).
name: f1-live-analytics

x-openf1: &openf1
  image: ${F1_OPENF1_IMAGE:?}
  build:
    context: ${F1_OPENF1_CHECKOUT:?}

x-openf1-environment: &openf1-environment
  MONGO_CONNECTION_STRING: mongodb://mongo:27017
  OPENF1_BASE_URL: http://api:8000/

services:
  api:
    <<: *openf1
    environment:
      <<: *openf1-environment
      ROLE: api
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - mqtt

  ingest-realtime:
    <<: *openf1
    environment:
      <<: *openf1-environment
      ROLE: ingest-realtime
      OPENF1_MQTT_URL: mqtt
      OPENF1_MQTT_PORT: 1883
      # No username or password: the broker allows anonymous connections, because a credential
      # this project invented is still a credential to store and keep out of a commit (ADR-0002).
      OPENF1_MQTT_NO_TLS: "true"
      # A switch spelled as a credential, and the value is deliberately not one.
      #
      # Formula 1 has closed the legacy SignalR endpoint the recorder used to reach: a negotiate
      # against `livetiming.formula1.com/signalr` now answers 401 with `WWW-Authenticate: Basic`
      # and `Bearer`, so the live path receives nothing at all. The replacement,
      # `livetiming.formula1.com/signalrcore`, still negotiates and subscribes anonymously.
      #
      # Upstream chooses between the two by whether `F1_TOKEN` is *set*, not by whether its value
      # authenticates: unset omits `--auth` and takes the dead endpoint, set passes `--auth` and
      # takes the live one (`real_time/recording.py`). It is then sent as a bearer, which Formula 1
      # is expected to ignore — this project holds no F1TV token and is not becoming a system that
      # does (ADR-0002). Whether the free subset arrives on an unauthenticated connection is the
      # measurement ADR-0002 leaves outstanding, and #42 settles it against a live Session.
      F1_TOKEN: unauthenticated
    depends_on:
      - api

  # A job rather than a service, and so it carries a profile: `bin/compose up` leaves it alone and
  # bin/backfill is the only thing that runs it. Its ROLE is unset because the entrypoint that
  # reads ROLE is what makes it a service — that path ingests a whole season and exits, which is
  # not what anyone asks for when they bring the stack up (ADR-0008).
  backfill:
    <<: *openf1
    profiles:
      - backfill
    environment:
      <<: *openf1-environment
    depends_on:
      - mongo

  # The other job, run by bin/catalogue. Upstream never wires this role into a service at all — the
  # collections it writes are populated by a scraper of formula1.com that has no place in the live
  # path — so it is a job here for the same reason backfill is one, and its own so that each
  # command starts the container named after it (ADR-0009).
  catalogue:
    <<: *openf1
    profiles:
      - catalogue
    environment:
      <<: *openf1-environment
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  mqtt:
    build:
      context: ./mqtt
    ports:
      - "1883:1883"
    volumes:
      - mqtt-data:/mosquitto/data

# Named, so the data lives inside the virtual machine's disk and inherits its placement on the
# external volume rather than needing a second rule of its own.
volumes:
  mongo-data:
  mqtt-data:
