# Weekly, one pull request per dependency, and a cooldown on the ecosystem a repository may one
# day let merge itself: ADR-0010 (in the management hub) argues all three, org-wide. How a bump
# is landed once it is open is `docs/agents/dependencies.md`.
#
# Only `github-actions` is here because it is the only ecosystem a newly generated repository
# certainly has — the workflow in `.github/workflows/`. Add an ecosystem when this repository
# gains one, and mind what a missing `cooldown` means: **omitting it is not zero**. The option's
# `default-days` has a minimum of 1, and an unconfigured ecosystem still takes Dependabot's own
# 3-day default for version updates. ADR-0010 wants no wait on `terraform`; three days is what
# the platform actually offers, and it costs nothing on bumps a human reads anyway.
#
# No `groups:` key, deliberately: a grouped pull request has to be judged by its worst member,
# and one-per-dependency names the culprit in the title when a bump breaks CI.
version: 2
updates:
  # The workflow pins every action to a commit (.github/workflows/ci.yml), which is safe but
  # frozen — Dependabot is what moves those pins forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Already the default, stated because the auto-merge path depends on it: GitHub will not
    # update a pull request that has fallen behind `main`, even with auto-merge queued and
    # `allow_update_branch` on — measured, see ADR-0010. Dependabot rebasing its own pull
    # requests is the only thing that gets a queued bump over a moved `main`, so the default is
    # load-bearing from the day this repository opts in.
    rebase-strategy: auto
    # Seven days, because this is the ecosystem a repository may let merge itself once its check
    # can genuinely fail for an action bump. `cooldown` delays version updates only; a security
    # update is never held back by it.
    cooldown:
      default-days: 7
