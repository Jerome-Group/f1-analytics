# The broker carries live records from the Ingestor to this project's own backend, both of them
# on this machine.
listener 1883

# Anonymous, because this project holds no credential of any kind, and one invented here would
# still be a secret to store and keep out of a commit (ADR-0002).
allow_anonymous true

# Survives a restart, so bouncing the broker mid-Session does not lose what was in flight. The
# path is the one the image gives its data volume.
persistence true
persistence_location /mosquitto/data
